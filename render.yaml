services:
  - type: web
    name: proponeu-web
    runtime: docker
    rootDir: django_app
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: proponeu-db
          property: connectionString
      - key: CARGAR_DEMO
        value: "True"
      - key: DEMO_PASSWORD
        sync: false
      # url publica del microservicio, ej: https://proponeu-ms.onrender.com/api/v1
      - key: MS_IA_URL
        sync: false
      - key: MS_API_KEY
        fromService:
          type: web
          name: proponeu-ms
          envVarKey: MS_API_KEY

  - type: web
    name: proponeu-ms
    runtime: docker
    rootDir: ms_ia
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: MS_API_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false

databases:
  - name: proponeu-db
    databaseName: proponeu
    user: proponeu
    plan: free
