services:
  - type: web
    name: proponeu-web
    runtime: docker
    rootDir: django_app
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: proponeu-db
          property: connectionString
      - key: CARGAR_DEMO
        value: "True"
      - key: DEMO_PASSWORD
        sync: false

databases:
  - name: proponeu-db
    databaseName: proponeu
    user: proponeu
    plan: free
