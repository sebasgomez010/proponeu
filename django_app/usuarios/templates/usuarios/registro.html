{% extends 'base.html' %}
{% block titulo %}Registro{% endblock %}
{% block contenido %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <div class="card border-0 shadow-sm">
      <div class="card-body p-4">
        <h1 class="h3 mb-1">Crear cuenta</h1>
        <p class="text-muted mb-4">Regístrate como estudiante o docente para proponer, votar y comentar.</p>
        <form method="post" novalidate>
          {% csrf_token %}
          {% include 'includes/form.html' %}
          <button class="btn btn-primary w-100" type="submit">Registrarme</button>
        </form>
        <p class="text-center mt-3 mb-0">¿Ya tienes cuenta? <a href="{% url 'login' %}">Inicia sesión</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
