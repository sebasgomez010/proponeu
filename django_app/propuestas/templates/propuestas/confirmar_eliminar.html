{% extends 'base.html' %}
{% block titulo %}Eliminar propuesta{% endblock %}
{% block contenido %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <div class="card border-0 shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4">¿Eliminar la propuesta?</h1>
        <p>Vas a eliminar <strong>«{{ propuesta.titulo }}»</strong> junto con sus votos y comentarios. Esta acción no se puede deshacer.</p>
        <form method="post" class="d-flex gap-2">
          {% csrf_token %}
          <button class="btn btn-danger" type="submit">Sí, eliminar</button>
          <a class="btn btn-outline-secondary" href="{{ propuesta.get_absolute_url }}">Cancelar</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
