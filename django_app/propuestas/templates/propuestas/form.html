{% extends 'base.html' %}
{% block titulo %}{% if object %}Editar propuesta{% else %}Nueva propuesta{% endif %}{% endblock %}
{% block contenido %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card border-0 shadow-sm">
      <div class="card-body p-4">
        <h1 class="h3 mb-4">{% if object %}Editar propuesta{% else %}Nueva propuesta{% endif %}</h1>
        <form method="post" novalidate>
          {% csrf_token %}
          {% include 'includes/form.html' %}
          <div class="d-flex gap-2">
            <button class="btn btn-primary" type="submit" name="publicar"><i class="bi bi-send"></i> Publicar</button>
            <button class="btn btn-outline-secondary" type="submit" name="borrador">Guardar como borrador</button>
            <a class="btn btn-link ms-auto" href="{% if object %}{{ object.get_absolute_url }}{% else %}{% url 'propuestas:lista' %}{% endif %}">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
